<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Charts Renderer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0d0f1a; --card: #1a1e35; --card2: #1f2442;
      --accent: #6c63ff; --accent2: #a78bfa; --green: #22d3a5;
      --orange: #f97316; --pink: #f472b6; --blue: #38bdf8;
      --text: #e2e8f0; --muted: #64748b;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
    body { background: #0b0d18; color: var(--text); padding: 30px; display: flex; flex-direction: column; gap: 24px; width: 680px; }
    .chart-card {
      background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .chart-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .chart-title { font-size: 16px; font-weight: 700; color: #fff; }
    .chart-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .chart-legend { display: flex; gap: 16px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-pill { background: var(--card2); padding: 12px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
    .stat-pill .num { font-size: 14px; font-weight: 700; color: #fff; }
    .stat-pill .tag { font-size: 10px; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="chart-card">
    <div class="chart-header">
      <div>
        <div class="chart-title">📊 Phân Bổ Chi Tiêu Theo Danh Mục</div>
        <div class="chart-sub">Dữ liệu tổng hợp từ SQLite · Tháng 10/2026</div>
      </div>
      <div class="chart-legend">
        <div class="legend-item"><span class="legend-dot" style="background:#f97316"></span>Ăn uống (45%)</div>
        <div class="legend-item"><span class="legend-dot" style="background:#38bdf8"></span>Di chuyển (20%)</div>
        <div class="legend-item"><span class="legend-dot" style="background:#f472b6"></span>Mua sắm (35%)</div>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat-pill"><div class="num" style="color:#f97316">1,540,000 đ</div><div class="tag">🍜 Ăn uống</div></div>
      <div class="stat-pill"><div class="num" style="color:#38bdf8">680,000 đ</div><div class="tag">🚗 Di chuyển</div></div>
      <div class="stat-pill"><div class="num" style="color:#f472b6">1,200,000 đ</div><div class="tag">🛍️ Mua sắm</div></div>
      <div class="stat-pill"><div class="num" style="color:#22d3a5">650,000 đ</div><div class="tag">💡 Tiện ích</div></div>
    </div>
    <div style="height: 220px; display: flex; justify-content: center;">
      <canvas id="pieChart"></canvas>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <div>
        <div class="chart-title">📈 Diễn Biến Chi Tiêu 7 Ngày Gần Nhất</div>
        <div class="chart-sub">Thống kê theo chu kỳ tuần</div>
      </div>
    </div>
    <div style="height: 180px;">
      <canvas id="barChart"></canvas>
    </div>
  </div>

  <script>
    new Chart(document.getElementById('pieChart').getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: ['Ăn uống', 'Di chuyển', 'Mua sắm', 'Tiện ích'],
        datasets: [{
          data: [1540000, 680000, 1200000, 650000],
          backgroundColor: ['#f97316', '#38bdf8', '#f472b6', '#22d3a5'],
          borderWidth: 0,
          hoverOffset: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '70%',
        plugins: { legend: { display: false } }
      }
    });

    new Chart(document.getElementById('barChart').getContext('2d'), {
      type: 'bar',
      data: {
        labels: ['06/10', '07/10', '08/10', '09/10', '10/10', '11/10', '12/10'],
        datasets: [{
          label: 'Số tiền chi tiêu (VNĐ)',
          data: [120000, 450000, 75000, 650000, 127000, 45000, 85000],
          backgroundColor: 'rgba(108, 99, 255, 0.65)',
          borderColor: '#6c63ff',
          borderWidth: 1.5,
          borderRadius: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', font: { size: 11 } } },
          y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', font: { size: 11 } } }
        }
      }
    });
  </script>
</body>
</html>
